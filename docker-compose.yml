services:
  mongo:
    image: mongo:6
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: reading_room
    depends_on:
      - mongo
    volumes:
      - uploads:/app/uploads
      - chroma-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_ORIGIN: backend:5000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  uploads:
  chroma-data:
